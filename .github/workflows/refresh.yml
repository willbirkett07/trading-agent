name: Live snapshot

on:
  schedule:
    # Every 10 minutes on weekdays from 13:00 to 21:50 UTC. It only reads your account; it never trades.
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Take a live snapshot (read-only, paper account)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python trading_agent.py --broker alpaca --snapshot

      - name: Save the snapshot for the dashboard
        if: always()
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add docs/data
          if ! git diff --staged --quiet; then
            git commit -m "live snapshot"
            git pull --rebase
            git push
          fi
